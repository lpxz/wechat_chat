<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Groq</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #ededed;
    display: flex;
    justify-content: center;
  }
  .phone {
    width: 420px;
    max-width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #ededed;
    box-shadow: 0 0 0 1px #ddd;
  }
  header {
    background: #07c160;
    color: #fff;
    text-align: center;
    padding: 14px 12px 12px;
    font-size: 17px;
    font-weight: 600;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px 8px;
  }
  .row { display: flex; margin: 8px 0; align-items: flex-end; gap: 8px; }
  .row.me { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #3d8bfd; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; flex-shrink: 0;
  }
  .bubble {
    max-width: 72%;
    padding: 8px 10px;
    border-radius: 4px;
    line-height: 1.45;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .me .bubble { background: #95ec69; }
  .bot .bubble { background: #fff; }
  .sys {
    text-align: center;
    color: #c00;
    font-size: 12px;
    margin: 8px 0;
  }
  .composer {
    display: flex;
    gap: 8px;
    padding: 8px;
    background: #f7f7f7;
    border-top: 1px solid #ddd;
  }
  #input {
    flex: 1;
    resize: none;
    height: 44px;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 8px;
    font: inherit;
  }
  #send {
    background: #07c160;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 0 16px;
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="phone">
  <header>Groq</header>
  <div id="log"></div>
  <div class="composer">
    <textarea id="input" placeholder="Type a message"></textarea>
    <button id="send" type="button">Send</button>
  </div>
</div>
<script>
  const logEl = document.getElementById("log");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  const ws = new WebSocket(proto + location.host + "/ws");

  let liveBot = null;

  function addRow(kind, text) {
    if (kind === "sys") {
      const div = document.createElement("div");
      div.className = "sys";
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
      return null;
    }
    const row = document.createElement("div");
    row.className = "row " + kind;
    if (kind === "bot") {
      const av = document.createElement("div");
      av.className = "avatar";
      av.textContent = "G";
      row.appendChild(av);
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
    return bubble;
  }

  function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addRow("me", text);
    liveBot = null;
    ws.send(JSON.stringify({ type: "user", text }));
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  ws.addEventListener("message", (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === "token") {
      if (!liveBot) liveBot = addRow("bot", "");
      liveBot.textContent += msg.text || "";
      logEl.scrollTop = logEl.scrollHeight;
    } else if (msg.type === "done") {
      liveBot = null;
    } else if (msg.type === "error") {
      liveBot = null;
      addRow("sys", msg.text || "error");
    }
  });

  ws.addEventListener("close", () => addRow("sys", "Disconnected from server"));
</script>
</body>
</html>
